[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathnest"
version = "1.0.0"
description = "Grouped directory bookmarks with a terminal UI - jump to project directories fast"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pyinstaller>=6",
]

[project.scripts]
# The binary name is `pn-bin`; the user-facing `pn` command is the shell
# wrapper installed by build.sh (shell/pn.sh), which enables `cd` support.
pn-bin = "pathnest.cli:main"

[tool.setuptools]
packages = ["pathnest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
