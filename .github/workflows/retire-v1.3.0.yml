name: Retire superseded v1.3.0 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-v1.3.0.yml']

permissions:
  contents: read

jobs:
  retire:
    if: github.repository == 'HosseinBazeghi/pathnest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify replacement and remove only the old release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.3.1" > replacement.json
          python3 - <<'PY'
          import json
          with open('replacement.json') as stream:
              release = json.load(stream)
          assert release['tag_name'] == 'v1.3.1'
          assert not release['draft'] and not release['prerelease']
          assets = {asset['name']: asset['size'] for asset in release['assets']}
          assert assets.get('pathnest-linux-x86_64.tar.gz', 0) > 0
          assert assets.get('pathnest-linux-x86_64.tar.gz.sha256', 0) > 0
          PY
          gh release delete v1.3.0 --repo "$GITHUB_REPOSITORY" --yes
          gh release view v1.3.1 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease
